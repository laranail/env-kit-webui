name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      # env-kit is not on Packagist yet; resolve it from its public repo
      # (no-api = git clone, avoids GitHub REST API rate limits). Other laranail
      # deps (package-tools) resolve from Packagist.
      - name: Resolve unpublished laranail packages from VCS
        run: composer config repositories.env-kit '{"type":"vcs","url":"https://github.com/laranail/env-kit","no-api":true}'
      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Pint (code style)
        # laranail-pint, not bare pint: it resolves the ONE shared config in
        # vendor/laranail/package-tools and errors if it is absent. Bare `pint`
        # silently falls back to its own defaults and exits 0, so this step was
        # reporting "clean" against a rule set no other package here uses.
        run: vendor/bin/laranail-pint --test

      - name: PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest (tests)
        run: vendor/bin/pest
