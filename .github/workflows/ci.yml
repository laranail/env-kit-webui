name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      # env-kit is not on Packagist yet; resolve it from its public repo
      # (no-api = git clone, avoids GitHub REST API rate limits). Other laranail
      # deps (package-tools) resolve from Packagist.
      - name: Resolve unpublished laranail packages from VCS
        run: composer config repositories.env-kit '{"type":"vcs","url":"https://github.com/laranail/env-kit","no-api":true}'
      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest (tests)
        run: vendor/bin/pest
